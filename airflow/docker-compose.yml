# Local Airflow for the mf-lakehouse pipeline. Runs on your machine only.
# Start:  docker compose -f airflow/docker-compose.yml up -d --build
# UI:     http://localhost:8081   (user: admin, password: see ADMIN_PASSWORD below)

x-airflow-common: &airflow-common
  build: .
  user: "50000:0"
  env_file:
    - ../.env                        # Databricks, AWS, dbt settings come from your .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    DBT_LOG_PATH: /tmp/dbt-logs
    DBT_TARGET_PATH: /tmp/dbt-target
  volumes:
    - ./dags:/opt/airflow/dags
    - ../dbt_mf:/opt/airflow/dbt_mf  # the dbt project, shared with the host
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password "${ADMIN_PASSWORD:-admin}" \
          --firstname Local \
          --lastname Admin \
          --role Admin \
          --email admin@localhost || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
