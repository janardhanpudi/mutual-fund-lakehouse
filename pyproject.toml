[project]
name = "mf-lakehouse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "janardhanpudi", email = "janardhan.pudi44@gmail.com" }
]
requires-python = "==3.12.14"
dependencies = [
    "boto3>=1.43.123",
    "databricks-sdk>=0.117.0",
    "databricks-sql-connector>=4.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.1.8",
    "streamlit>=1.67.0",
    "xlrd>=2.0.2",
    "yfinance>=1.7.0",
]

[project.scripts]
mf-lakehouse = "mf_lakehouse:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dbt-databricks>=1.13.0",
    "jupyterlab>=4.6.5",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
