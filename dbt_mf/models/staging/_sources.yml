version: 2

sources:
  - name: bronze
    description: Raw tables loaded by Databricks Auto Loader (databricks/bronze_ingest.py). Append-only.
    schema: bronze
    config:
      loaded_at_field: _bronze_loaded_at
      freshness:
        warn_after: {count: 1, period: day}
        error_after: {count: 3, period: day}
    tables:
      - name: nav
        description: AMFI NAVs from the daily file and NAV history (daily, 7-day lookback, backfill).
      - name: index_prices
        description: Nifty 50 and Sensex daily prices from yfinance.
      - name: ter
        description: AMFI total expense ratio, one row per scheme per day; current and previous month re-fetched each run.
        config:
          freshness:
            warn_after: {count: 3, period: day}
            error_after: {count: 7, period: day}
      - name: aum
        description: AMFI monthly AUM report, one row per category per month.
        config:
          freshness:
            warn_after: {count: 45, period: day}
            error_after: {count: 75, period: day}
      - name: scheme_master_cdc
        description: Changed rows from Neon scheme_master (CDC); arrives only when schemes change, so no freshness check.
        config:
          freshness: null
